name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
      ARCHIVE: tdiv-${{ github.ref_name }}-windows-x86_64.zip
    steps:
      - name: Validate tag format
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "Invalid tag format: $env:GITHUB_REF_NAME"
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/$env:TARGET/release/tdiv.exe"
          $required = @(
            $exe,
            "README.md",
            "LICENSE",
            "LICENSE-THIRD-PARTY.md"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required asset: $file"
            }
          }
          if ((Get-Item $exe).Length -le 0) {
            throw "Binary is empty: $exe"
          }

          Compress-Archive -Path $required -DestinationPath $env:ARCHIVE -Force
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE" | Out-File "$env:ARCHIVE.sha256" -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          $env:ARCHIVE "$env:ARCHIVE.sha256"
          --verify-tag --title "Release $env:GITHUB_REF_NAME" --generate-notes
