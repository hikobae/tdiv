name: Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate tag format
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "Invalid tag format: $env:GITHUB_REF_NAME"
          }

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --release --locked

      - name: Validate build artifact
        shell: powershell
        run: |
          $exe = "target/release/tdiv.exe"
          if (!(Test-Path $exe)) {
            throw "Binary not found: $exe"
          }

          $size = (Get-Item $exe).Length
          if ($size -le 0) {
            throw "Binary is empty: $exe"
          }

      - name: Package
        shell: powershell
        run: |
          $required = @(
            "target/release/tdiv.exe",
            "README.md",
            "LICENSE",
            "LICENSE-THIRD-PARTY.md"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required asset: $file"
            }
          }

          $name = "tdiv-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
          Compress-Archive -Path $required -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii
          "ASSET=$name" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" --title "Release $env:GITHUB_REF_NAME" --generate-notes
